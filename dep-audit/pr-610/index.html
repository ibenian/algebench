<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'dark' });

  const md = document.getElementById('raw-md').textContent;

  const alertIcons = {
    note: 'ℹ️', tip: '💡', important: '❗',
    warning: '⚠️', caution: '🛑'
  };

  const renderer = new marked.Renderer();
  const origCode = renderer.code.bind(renderer);
  renderer.code = function(code, language) {
    if (language === 'mermaid') {
      return '<div class="mermaid">' + code + '</div>';
    }
    return origCode(code, language);
  };
  const origBlockquote = renderer.blockquote.bind(renderer);
  renderer.blockquote = function(quote) {
    const m = quote.match(/^\s*<p>\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][\s\n]*/i);
    if (m) {
      const kind = m[1].toLowerCase();
      const body = quote.replace(m[0], '<p>');
      const icon = alertIcons[kind] || '';
      return '<div class="markdown-alert markdown-alert-' + kind + '">'
        + '<p class="markdown-alert-title">' + icon + ' ' + m[1] + '</p>'
        + body + '</div>';
    }
    return origBlockquote(quote);
  };

  marked.setOptions({ renderer, gfm: true, breaks: false });
  const dirty = marked.parse(md);
  if (typeof DOMPurify !== 'undefined') {
    document.getElementById('content').innerHTML = DOMPurify.sanitize(dirty, {ADD_TAGS: ['div'], ADD_ATTR: ['class']});
  } else {
    document.getElementById('content').innerHTML = dirty;
  }

  await mermaid.run();
</script>

### How to read this

- ⬆️ **Ready** (12) — a newer release has cleared the 30 days cooldown. Take it with a targeted relock.
- ⏳ **Cooling** (45) — something newer exists but is younger than 30 days. **This is the policy working, not a problem.** Compromised packages are usually caught and yanked within hours to days; waiting removes most of that exposure.
- 🔒 **Capped** (1) — the cooldown is not what is holding this back; a constraint in `requirements.txt` (or a transitive dependency's own pin) is. Loosening the range is the only way forward.
- 🔻 **Backwards** (2) — a relock would move this to an *older* release, because the current pin is itself younger than 30 days (a security fix taken deliberately). Older releases carry more advisories, never fewer — check the diff before committing any relock while this row is present.
- ✅ **Current** — nothing newer exists.

> **Allowed** is what `uv pip compile --upgrade` would pin today. **Latest on PyPI** may be unreachable regardless of the cooldown if a constraint caps it.


## Ignored by policy

These do not fail the build. They are listed in full every run so the exclusion stays auditable rather than silent.

### [PYSEC-2026-2447](https://github.com/advisories/GHSA-w8v5-vhqr-4h9v) — `diskcache` `5.6.3`

**Why no upgrade:** Unfixable rather than unfixed. `diskcache` uses `pickle` as its default serializer by design, across all 76 releases (0.1.0–5.6.3). Its last release was 2023-08-31, years before the advisory was published in Feb 2026, and the project is effectively unmaintained — there is no version to upgrade to, and none is coming.

**Mitigating today:**

- `dspy.configure_cache(restrict_pickle=True)` is applied in `backend/experts/llm_config.py`, restricting deserialization to a known-safe type set. This is the direct mitigation for the flaw. (`JSONDisk`, the advisory's general advice, is unreachable here: dspy exposes no way to swap the disk backend, and it caches litellm `ModelResponse` objects that are not JSON-serializable.)
- LM response caching is **off by default** (`ALGEBENCH_LM_CACHE`), so the pickle store is not written at all during normal local use.
- Exploitation requires **write access to the cache directory** (CVSS `AV:L/PR:L`). Anything holding that on a single-user machine can already execute as that user and has no need of a pickle.
- Deploys are isolated, single-tenant, ephemeral containers — the advisory names shared storage and multi-tenant hosts as the high-risk contexts, and neither applies.

**Still outstanding:**

- **Cache poisoning is a separate, lower-bar threat that `restrict_pickle` does not address.** It constrains deserialization, not content: a crafted entry built only from safe types is accepted, served as though the model produced it, and — because the proof-completion refinement loop threads responses back into the next prompt — becomes input to a subsequent live LLM call. The precondition is the same (write access to the cache directory), so the same containment applies, but no deserialization setting can prevent it.
