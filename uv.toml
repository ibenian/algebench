# uv configuration for AlgeBench.
#
# SUPPLY-CHAIN COOLDOWN
#
# `exclude-newer` refuses any release published in the last 30 days. This is
# uv's own mechanism, applied automatically to *every* uv command run inside
# this project — `uv pip install`, `uv pip compile`, `uv add`, and anything
# run.sh does. It needs no wrapper script, so it cannot be bypassed by reaching
# for uv directly — there is no wrapper to go around.
#
# Why: compromised packages are typically found and yanked within hours to days
# of publication (litellm 1.82.7/1.82.8 were quarantined ~40 minutes after
# release, March 2026). A cooldown removes most of that exposure without
# needing to know anything is wrong — it simply declines anything too fresh to
# have been noticed. Crucially this protects the *install*, which is where
# malicious code executes; a CI or PR gate is too late for a local machine.
#
# The trade-off, stated plainly: security fixes are also held back. A published
# CVE is a present risk whose fix is usually days old, so that case overrides
# the cooldown explicitly:
#
#     UV_EXCLUDE_NEWER="0 days" uv pip compile requirements.txt -o requirements.lock \\
#         --universal --python-version 3.12 --no-header --upgrade-package <name>
#
# Do NOT reach for that override yourself — it is the user's call. See AGENTS.md.
#
# uv's own env var beats this file, so the same override works for any ad-hoc
# uv command. No wrapper flag is needed.
#
# REQUIRES uv >= 0.11.15 (enforced by scripts/setup-venv.sh). Relative durations
# in `exclude-newer` arrived in uv 0.9.17 (astral-sh/uv#16814) — before that only
# absolute timestamps parsed, and older uv dies on this file with a TOML error
# that names a line number rather than the cause. The floor is 0.11.15 rather
# than 0.9.17 for security: an arbitrary file write via entry point names is
# unfixed below 0.11.15 (GHSA-4gg8-gxpx-9rph), and an arbitrary file deletion via
# RECORD entries below 0.11.6 (GHSA-pjjw-68hj-v9mw) — so 0.11.6-0.11.14 is
# affected by the first only. Both trigger on INSTALL. See setup-venv.sh.
#
# A duration is deliberate. An absolute timestamp would need a human to roll it
# forward, and a date nobody edits silently TIGHTENS the cutoff as it ages,
# eventually holding back the security fixes this policy is meant to let through.
#
# NOTE: this applies to PyPI releases only. A git dependency (gemini-live-tools)
# has no upload timestamp to filter on, so the cooldown does not reach it — the
# lock pins it by immutable commit SHA instead.
#
# NOTE: units must be fixed-length — "30 days", "1 week" and "24 hours" all parse;
# "3 months" does not, because a month has no fixed duration.
# uv enforces this itself, on every project command, and refuses with an
# actionable message ("Update `uv` by running `uv self update`"). That is why
# there is no hand-rolled version check in setup-venv.sh: uv's own mechanism
# cannot be bypassed by reaching for uv directly, and covers entry points a
# script gate never would (e.g. the `uv pip install` in
# .agents/skills/update-glt/SKILL.md).
#
# CAVEAT: `uv tool run` / `uvx` does NOT read this file at all. That is
# documented, not a quirk — https://docs.astral.sh/uv/concepts/configuration-files/
# : "For `tool` commands, which operate at the user level, local configuration
# files will be ignored." Reproduced against uv 0.10.12 in this directory:
# `uv pip compile` is refused, `uv tool run --no-cache <tool>` installs happily.
#
# So BOTH settings in this file are bypassed for tool commands — the floor above
# and the cooldown below. scripts/dependency_audit_report.py therefore checks the
# version itself AND passes `--exclude-newer` explicitly for the one `uv tool run`
# call it makes; see the UV_MIN comment there. That call is the install path the
# advisories concern, which is why it gets its own belt.
required-version = ">=0.11.15"

exclude-newer = "30 days"
