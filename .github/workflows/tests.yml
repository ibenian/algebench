name: Tests

# `pytest` is a REQUIRED status check (the "main protection" ruleset), so it must
# report on every PR — path-filtering the workflow would leave a docs-only PR
# stuck on "Expected — waiting for status to be reported" forever. So the suite
# ALWAYS runs (the check always reports); what varies is depth.
#
# Depth is decided by EVENT, not by which files changed:
#   pull_request           → --sampled 20, and -m 'not timing'
#   push(main) / dispatch  → --exhaustive (a SUPERSET of any sampled run)
#
# A PR gets fast feedback; main runs everything before it counts as green. The
# window that opens is one merge wide, which is the ordinary cost of sampling.
#
# main being a superset is what makes the small PR sample safe. `exhaustive()`
# pins the operator to "add" and varies the other four axes; `sampled()` draws
# from all five. So the sample is the only thing that ever reaches the other
# five operators, and before it was folded into the exhaustive run, shrinking
# the PR sample silently shrank the project's total coverage.
#
# Sizing, measured rather than guessed, on a 205.7s local suite:
#   -m 'not timing'   205.7s → 151.2s   (7 tests that sleep on real timeouts)
#   --sampled 20      151.2s → 128.9s
#   --sampled 1       worth a further 0.9s — below the noise floor, and a real
#                     PR build of it came in 43s SLOWER than --sampled 20.
#
# Test selection is therefore spent. What remains is not selection: the runner
# is ~2.4x slower than a dev machine, `Set up .venv` rebuilds every run (~35s),
# and the bulk of execution is CAS-backed proof edits, which are CPU-bound and
# would parallelise.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up .venv
        run: ./scripts/setup-venv.sh

      - name: Install test runner
        run: |
          ./run.sh -m pip install pytest -q

      - name: Run tests
        id: tests
        run: |
          # Depth by event: a pull request runs sampled and skips the clock-bound
          # tests; anything that lands on main runs everything.
          # An ARRAY, not a string: `-m "not timing"` contains a space, and an
          # unquoted string would word-split into `-m`, `'not`, `timing'`.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            ARGS=(--exhaustive)
            SHOWN="--exhaustive"
            REASON="${{ github.event_name }} event — main must stay green"
            DEPTH="FULL — exhaustive ∪ sample, timing tests included"
          else
            ARGS=(--sampled 20 -m "not timing")
            SHOWN="--sampled 20 -m 'not timing'"
            REASON="pull request — full run happens on merge to main"
            DEPTH="FAST — sampled 20, timing tests deselected"
          fi
          # Surface the mode everywhere it's visible: the log, an annotation, and
          # the run's Summary tab.
          echo "==================================================================="
          echo "  Test depth: ${DEPTH}"
          echo "  Reason:     ${REASON}"
          echo "==================================================================="
          echo "::notice title=Test depth::${DEPTH} (${REASON})"
          {
            echo "### 🧪 Test depth: ${DEPTH}"
            echo ""
            echo "**Reason:** ${REASON}"
            echo ""
            echo "\`pytest tests/ ${SHOWN}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          ./run.sh -m pytest tests/ -v --tb=short "${ARGS[@]}" --junitxml=test-results.xml 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post failure report as PR comment
        if: github.event_name == 'pull_request' && steps.tests.outputs.exit_code != '' && steps.tests.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(cat test-output.txt)
          SUMMARY=$(echo "$OUTPUT" | grep -E '^\s*=+.*(passed|failed|error)' | tail -1 | sed 's/=//g' | xargs)
          FAILED=$(echo "$OUTPUT" | grep '^FAILED ' | sed 's/^FAILED //' || true)

          BODY="<!-- test-report -->
          ### ❌ Test Failures

          **${SUMMARY}**

          \`\`\`
          ${FAILED}
          \`\`\`

          <details>
          <summary>Full Output</summary>

          \`\`\`
          ${OUTPUT}
          \`\`\`

          </details>"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$BODY" \
            --edit-last 2>/dev/null || \
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$BODY"

      - name: Fail if tests failed
        if: always() && steps.tests.outputs.exit_code != '' && steps.tests.outputs.exit_code != '0'
        run: |
          echo "❌ Tests failed"
          exit 1
