name: Tests

# `pytest` is a REQUIRED status check (the "main protection" ruleset), so it must
# report on every PR — path-filtering the workflow would leave a docs-only PR
# stuck on "Expected — waiting for status to be reported" forever. So the suite
# ALWAYS runs (the check always reports); what varies is depth.
#
# Depth is decided by EVENT, not by which files changed:
#   pull_request              → SAMPLED (conftest's default --sampled 200)
#   push(main) / dispatch     → EXHAUSTIVE
#
# The trade is deliberate. A PR gets fast feedback; main gets the full
# cross-product before anything is considered green, so a combination the
# sampled draw happened to miss is caught at the merge rather than never.
# The window this opens is one merge wide: a PR can go green and main can then
# fail, which is the normal cost of sampling and is why main runs full.
#
# This used to also run exhaustive for any PR touching Python, which in practice
# meant most PRs took the slow path. Measured, that clause bought little: the
# depth flag moves ~30s of a ~3.5min suite (the cross-product coverage test,
# 25.7s → 29.7s, and the proof-edit sweep, 45.6s → 71.2s). The rest of the suite
# is identical either way, and the slowest tests in it — CAS-backed proof edits
# and cas_guard concurrency — are unaffected by the flag entirely.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up .venv
        run: ./scripts/setup-venv.sh

      - name: Install test runner
        run: |
          ./run.sh -m pip install pytest -q

      - name: Run tests
        id: tests
        run: |
          # Depth by event: a pull request runs sampled and skips the clock-bound
          # tests; anything that lands on main runs everything.
          # An ARRAY, not a string: `-m "not timing"` contains a space, and an
          # unquoted string would word-split into `-m`, `'not`, `timing'`.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            ARGS=(--exhaustive)
            SHOWN="--exhaustive"
            REASON="${{ github.event_name }} event — main must stay green"
            DEPTH="FULL — exhaustive ∪ sample, timing tests included"
          else
            ARGS=(--sampled 20 -m "not timing")
            SHOWN="--sampled 20 -m 'not timing'"
            REASON="pull request — full run happens on merge to main"
            DEPTH="FAST — sampled 20, timing tests deselected"
          fi
          # Surface the mode everywhere it's visible: the log, an annotation, and
          # the run's Summary tab.
          echo "==================================================================="
          echo "  Test depth: ${DEPTH}"
          echo "  Reason:     ${REASON}"
          echo "==================================================================="
          echo "::notice title=Test depth::${DEPTH} (${REASON})"
          {
            echo "### 🧪 Test depth: ${DEPTH}"
            echo ""
            echo "**Reason:** ${REASON}"
            echo ""
            echo "\`pytest tests/ ${SHOWN}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          ./run.sh -m pytest tests/ -v --tb=short "${ARGS[@]}" --junitxml=test-results.xml 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post failure report as PR comment
        if: github.event_name == 'pull_request' && steps.tests.outputs.exit_code != '' && steps.tests.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(cat test-output.txt)
          SUMMARY=$(echo "$OUTPUT" | grep -E '^\s*=+.*(passed|failed|error)' | tail -1 | sed 's/=//g' | xargs)
          FAILED=$(echo "$OUTPUT" | grep '^FAILED ' | sed 's/^FAILED //' || true)

          BODY="<!-- test-report -->
          ### ❌ Test Failures

          **${SUMMARY}**

          \`\`\`
          ${FAILED}
          \`\`\`

          <details>
          <summary>Full Output</summary>

          \`\`\`
          ${OUTPUT}
          \`\`\`

          </details>"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$BODY" \
            --edit-last 2>/dev/null || \
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$BODY"

      - name: Fail if tests failed
        if: always() && steps.tests.outputs.exit_code != '' && steps.tests.outputs.exit_code != '0'
        run: |
          echo "❌ Tests failed"
          exit 1
