name: Backend Model

# Guards backend/model/lesson.py against drift from schemas/lesson.schema.json.
#
# The mirror image of frontend-types.yml: that job regenerates the TypeScript
# declarations and fails if they no longer match the schema; this one checks the
# pydantic models the DSPy builders return. The schema is maintained by hand and
# by the `algebench-schema-generator` skill — not by a deterministic build — so
# either artifact can silently fall behind it.
#
# This is its own workflow rather than a job in validate-data.yml because that
# workflow validates DATA FILES on disk; a model-versus-schema conformance check
# is a different thing wearing the same words.
#
# YES, tests.yml already runs these same two files — `pytest tests/` collects them
# recursively, on every PR, as a required check. This job is deliberate duplicate
# EXECUTION, kept for two reasons that survive scrutiny:
#
#   * SPEED AND SIGNAL. The full suite takes ~9 minutes; this takes seconds. A
#     schema or contract break reports almost immediately, and reports as "your
#     schema edit broke the model" rather than one red line among ~5900 tests.
#   * THE JOB IS ITSELF AN ASSERTION. Installing only pydantic + jsonschema +
#     pytest proves backend/model/lesson.py and contracts.py stand alone —
#     something tests.yml can never show, because it runs inside the full project
#     venv where every heavy dependency is present. test_model_imports_nothing_heavy
#     checks a hardcoded allowlist; this job checks ALL of them.
#
# (An earlier version of this comment claimed tests.yml might SAMPLE these tests
# out. That was wrong: `--sampled 200` samples the semantic-graph cross-product,
# a parametrised generator — not the suite. Corrected rather than left standing,
# since it was the load-bearing argument for this workflow existing.)
#
# Path-filtered, so do NOT mark it a required check — see the note in
# frontend-types.yml about PRs stuck on "Expected — waiting for status".
on:
  pull_request:
    paths:
      - 'schemas/*.schema.json'
      - 'backend/model/**'
      # The wire contract and its parity test belong here too: contracts.py is the
      # file most likely to break agreement with src/placement.ts, and without it a
      # contracts-only change gets no NAMED signal — the general Tests workflow
      # still runs the parity test, so nothing goes unverified, but the failure
      # reads as "tests are broken" rather than "you broke the contract".
      - 'backend/experts/contracts.py'
      - 'tests/test_lesson_model.py'
      - 'tests/backend/experts/test_placement_parity.py'
      - '.github/workflows/backend-model.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  model:
    name: Model matches the schema
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Deliberately NOT requirements.lock: backend/model/lesson.py imports
      # nothing heavy (the test asserts it), so three packages suffice and the
      # job finishes in seconds.
      - name: Install dependencies
        run: pip install pydantic jsonschema pytest

      - name: Model round-trips the corpus, and the contract matches its TS mirror
        run: PYTHONPATH=. python -m pytest tests/test_lesson_model.py tests/backend/experts/test_placement_parity.py -q
