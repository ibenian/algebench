name: Frontend

# Guards the generated TypeScript declarations in src/types/ against drift.
#
# schemas/lesson.schema.json is maintained by hand and by the
# `algebench-schema-generator` skill — not by a deterministic build — so the
# committed .d.ts can silently fall behind it. This job regenerates and fails
# if the result differs, then type-checks the output under `strict`.
#
# Path-filtered: it only has an opinion when a schema, the generator, the
# generated types, or the TS config changes. It is NOT a required status
# check, so a filtered-out PR skipping it is fine. If it is ever promoted to
# required, drop the paths filter first — a required check that never reports
# leaves PRs stuck on "Expected — waiting for status to be reported".
on:
  pull_request:
    paths:
      - 'schemas/*.json'
      - 'scripts/generate_ts_types.mjs'
      - 'src/**'
      - 'static/**'
      - '*.html'
      - 'tsconfig.json'
      - 'vite.config.mts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-types.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  types:
    name: Types, build and bundle sync
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dev dependencies
        run: npm ci

      - name: Check generated types match the schemas
        run: npm run types:check

      - name: Type-check
        run: npm run typecheck

      # The bundle in static/dist/ is committed so that Render and the HF
      # Space serve ready-made artifacts without ever running Node. That only
      # holds if the committed output actually matches src/ — rebuild and
      # fail if anything moved.
      - name: Build frontend
        run: npx vite build

      - name: Check committed build output is up to date
        run: |
          if ! git diff --exit-code -- static/; then
            echo "::error::static/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      # The app's CSP is script-src 'self' https://cdn.jsdelivr.net with no
      # 'unsafe-inline' (backend/server.py), so a single inline <script> in
      # the emitted HTML takes the whole page down. Vite's module-preload
      # polyfill is the usual culprit; it is disabled in vite.config.mts.
      - name: Assert no inline script in emitted HTML
        run: |
          if grep -nE '<script[^>]*>[^<]' static/index.html static/prove.html static/renderproof.html; then
            echo "::error::inline <script> found in emitted HTML — the CSP will block it."
            exit 1
          fi
          echo "no inline scripts ✓"

      - name: Frontend unit tests
        run: npm test
